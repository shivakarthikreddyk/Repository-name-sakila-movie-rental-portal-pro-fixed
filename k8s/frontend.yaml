apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakila-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakila-frontend
  template:
    metadata:
      labels:
        app: sakila-frontend
    spec:
      containers:
        - name: frontend
          image: sakila-movie-rental-portal-pro-fixed-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sakila-frontend
spec:
  type: NodePort
  selector:
    app: sakila-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
