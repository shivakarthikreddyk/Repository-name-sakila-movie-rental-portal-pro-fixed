apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakila-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakila-backend
  template:
    metadata:
      labels:
        app: sakila-backend
    spec:
      containers:
        - name: backend
          image: sakila-backend:local
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: sakila-mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: sakila
            - name: DB_PASSWORD
              value: p_ssW0rd
            - name: DB_NAME
              value: sakila
            - name: PORT
              value: "5000"
            - name: DD_AGENT_HOST
              value: "datadog-agent.datadog.svc.cluster.local"
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
            - name: DD_ENV
              value: "local"
            - name: DD_SERVICE
              value: "sakila-backend"
            - name: DD_VERSION
              value: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: sakila-backend
spec:
  type: NodePort
  selector:
    app: sakila-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080