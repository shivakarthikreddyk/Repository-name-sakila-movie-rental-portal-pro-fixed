apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakila-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sakila-backend
  template:
    metadata:
      labels:
        app: sakila-backend
    spec:
      containers:
        - name: backend
          image: sakila-backend:local
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: sakila-mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: sakila
            - name: DB_PASSWORD
              value: p_ssW0rd
            - name: DB_NAME
              value: sakila
            - name: PORT
              value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: sakila-backend
spec:
  type: NodePort
  selector:
    app: sakila-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080