name: sakila-portal
services:
  mysql:
    image: ${DATABASE_IMAGE:-sakila-database:local}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sakila
      MYSQL_USER: sakila
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u sakila sakila -Nse 'SELECT COUNT(*) FROM film; SELECT COUNT(*) FROM rental;' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [data]

  backend:
    image: ${BACKEND_IMAGE:-sakila-backend:local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: sakila
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: sakila
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      data:
      web:
        aliases: [sakila-backend]

  frontend:
    image: ${FRONTEND_IMAGE:-sakila-frontend:local}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8093}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [web]

volumes:
  mysql-data:
networks:
  data:
    internal: true
  web:
