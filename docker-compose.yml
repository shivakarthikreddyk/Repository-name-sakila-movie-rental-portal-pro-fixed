services:
  mysql:
    image: sakiladb/mysql:latest
    container_name: sakila-pro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sakila
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sakila-pro-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: sakila
      DB_PASSWORD: p_ssW0rd
      DB_NAME: sakila
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sakila-pro-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
