datadog:
  site: "us5.datadoghq.com"
  hostname: "docker-desktop"
  hostnameFile: ""
  clusterName: "docker-desktop"
  apiKeyExistingSecret: "datadog-secret"

  clusterChecks:
    enabled: true

  orchestratorExplorer:
    enabled: true

  logs:
    enabled: true
    containerCollectAll: true

  apm:
    portEnabled: true

  processAgent:
    enabled: false

  kubeStateMetricsEnabled: true

agents:
  containers:
    agent:
      env:
        - name: DD_HOSTNAME
          value: "docker-desktop"
        - name: DD_HOSTNAME_FORCE_CONFIG_AS_CANONICAL
          value: "true"