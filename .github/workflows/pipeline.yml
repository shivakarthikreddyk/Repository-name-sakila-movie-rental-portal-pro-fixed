name: Test, publish, and deploy Sakila

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakila-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
    env:
      COMPOSE_PROJECT_NAME: sakila-ci
      APP_PORT: '8093'
      APP_BIND_ADDRESS: 127.0.0.1
      SAKILA_BASE_URL: http://127.0.0.1:8093
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Choose immutable build tags and release version
        id: metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          version="0.1.${GITHUB_RUN_NUMBER}-ci.${GITHUB_RUN_ATTEMPT}"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            publish=true
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release tags must be vMAJOR.MINOR.PATCH'; exit 1; }
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          for service in BACKEND FRONTEND DATABASE; do
            echo "${service}_IMAGE=ghcr.io/${repository}-${service,,}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          done
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Install dependencies and run backend unit tests
        run: |
          npm ci --prefix backend
          npm test --prefix backend
          npm ci --prefix frontend
          npm run build --prefix frontend
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          bash -n deployment/deploy.sh
          python -m pytest tests/test_release.py tests/test_deploy_script.py tests/test_kubernetes.py -q
      - name: Build the three images once
        run: docker compose -f docker-compose.yml -f compose.build.yml build
      - name: Start full stack and wait for database and API readiness
        run: docker compose up -d --wait --wait-timeout 240
      - name: Pytest API and browser checks through Nginx
        run: python -m pytest tests/test_stack.py tests/test_browser.py --browser chromium --junitxml=test-results/pytest.xml
      - name: Verify data survives container replacement
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 240 mysql backend frontend
          python -m pytest tests/test_stack.py -q
      - name: Sign into GHCR
        if: steps.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact images that passed the tests
        if: steps.metadata.outputs.publish == 'true'
        run: |
          for image in "$DATABASE_IMAGE" "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            for attempt in 1 2 3; do
              if docker push "$image"; then break; fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
              echo "Registry push failed; retrying the same tested image ($attempt/3)."
              sleep 10
            done
          done
      - name: Package deployment scripts and image digests
        if: steps.metadata.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: python scripts/package-release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: steps.metadata.outputs.publish == 'true'
        with:
          name: octopus-package
          path: artifacts/sakila-deploy.*.zip
          if-no-files-found: error
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Remove this runner's disposable test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  octopus:
    needs: test-and-publish
    if: needs.test-and-publish.outputs.publish == 'true' && vars.OCTOPUS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: sakila-octopus-deployment
      cancel-in-progress: false
    env:
      OCTOPUS_URL: ${{ vars.OCTOPUS_URL }}
      OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE }}
      OCTOPUS_SERVICE_ACCOUNT_ID: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}
      OCTOPUS_PROJECT: ${{ vars.OCTOPUS_PROJECT }}
      OCTOPUS_ENVIRONMENT: ${{ vars.OCTOPUS_ENVIRONMENT }}
    steps:
      - name: Validate Octopus configuration
        run: |
          : "${OCTOPUS_URL:?Set repository variable OCTOPUS_URL}"
          : "${OCTOPUS_SPACE:?Set repository variable OCTOPUS_SPACE}"
          : "${OCTOPUS_SERVICE_ACCOUNT_ID:?Set repository variable OCTOPUS_SERVICE_ACCOUNT_ID}"
          : "${OCTOPUS_PROJECT:?Set repository variable OCTOPUS_PROJECT}"
          : "${OCTOPUS_ENVIRONMENT:?Set repository variable OCTOPUS_ENVIRONMENT}"
          [[ "$OCTOPUS_PROJECT" == Sakila-Movie-Rental-Portal ]] || { echo "Refusing to deploy Sakila to another Octopus project"; exit 1; }
          [[ "$OCTOPUS_ENVIRONMENT" == Development ]] || { echo 'New releases must start in Development'; exit 1; }
      - name: Authenticate to Octopus with GitHub OIDC
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: octopus-package
          path: artifacts
      - name: Push deployment package to the built-in Octopus feed
        uses: OctopusDeploy/push-package-action@v3
        with:
          packages: artifacts/sakila-deploy.${{ needs.test-and-publish.outputs.version }}.zip
      - name: Create release with the exact package version
        id: release
        uses: OctopusDeploy/create-release-action@v3
        with:
          project: ${{ vars.OCTOPUS_PROJECT }}
          release_number: ${{ needs.test-and-publish.outputs.version }}
          packages: sakila-deploy:${{ needs.test-and-publish.outputs.version }}
          release_notes: Commit ${{ github.sha }}; tested images are pinned in release.json. Sakila Kubernetes environments v1.
      - name: Deploy through the polling Tentacle
        id: deploy
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          project: ${{ vars.OCTOPUS_PROJECT }}
          release_number: ${{ steps.release.outputs.release_number }}
          environments: ${{ vars.OCTOPUS_ENVIRONMENT }}
          variables: |
            GHCR.Username:${{ github.actor }}
            GHCR.Token:${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the actual deployment result
        id: wait
        uses: OctopusDeploy/await-task-action@v3
        with:
          server_task_id: ${{ fromJson(steps.deploy.outputs.server_tasks)[0].serverTaskId }}
          timeout_after: 1200
      - name: Require a successful Octopus task
        env:
          TASK_STATE: ${{ steps.wait.outputs.task_state }}
        run: |
          [[ "$TASK_STATE" == Success ]] || { echo "Octopus deployment ended with state: $TASK_STATE"; exit 1; }
      - name: Promote the same release to QA
        id: qa
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          project: ${{ vars.OCTOPUS_PROJECT }}
          release_number: ${{ steps.release.outputs.release_number }}
          environments: QA
          variables: |
            GHCR.Username:${{ github.actor }}
            GHCR.Token:${{ secrets.GITHUB_TOKEN }}
      - name: Wait for QA deployment and smoke checks
        id: qa_wait
        uses: OctopusDeploy/await-task-action@v3
        with:
          server_task_id: ${{ fromJson(steps.qa.outputs.server_tasks)[0].serverTaskId }}
          timeout_after: 1200
      - name: Require successful QA before Production promotion
        env:
          TASK_STATE: ${{ steps.qa_wait.outputs.task_state }}
        run: |
          [[ "$TASK_STATE" == Success ]] || { echo "QA deployment ended with state: $TASK_STATE"; exit 1; }
